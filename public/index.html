<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Mise en page : barre d'onglets collante + zone de travail ; cartes élèves en grille tactile, voies = prises colorées */
:root{
  --bg:#eef0ec; --surface:#fbfcfa; --surface2:#e3e7e1; --ink:#1b2320; --muted:#5c6862; --line:#cfd6cf;
  --accent:#d9482b; --accent-ink:#fff; --ok:#2f8a4a; --warn:#b7791f; --bad:#b33a2f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --gold:#e3b341; --silver:#c3c9cc; --bronze:#cf9160;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a18; --surface:#1e2522; --surface2:#28312d; --ink:#e7ece8; --muted:#9aa7a0; --line:#34403a;
  --accent:#f0643f; --accent-ink:#1a0d08; --ok:#58b874; --warn:#e0a64a; --bad:#e46a5d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a18; --surface:#1e2522; --surface2:#28312d; --ink:#e7ece8; --muted:#9aa7a0; --line:#34403a;
  --accent:#f0643f; --accent-ink:#1a0d08; --ok:#58b874; --warn:#e0a64a; --bad:#e46a5d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px}
.brand{white-space:nowrap;flex:none;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:28px}
.top select{margin-left:auto;min-width:0;flex:0 1 auto;max-width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
nav button{border:0;background:none;padding:10px 14px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:18px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.notice{background:var(--surface2);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice b{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.card:hover{border-color:var(--accent)}
.card .nm{font-weight:700;line-height:1.2}
.card .nm small{display:block;font-weight:400;color:var(--muted)}
.card .st{display:flex;justify-content:space-between;align-items:end;margin-top:auto;font-variant-numeric:tabular-nums}
.pts{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.pts small{font-size:13px;color:var(--muted);font-weight:600}
.lvl{font-family:var(--display);font-weight:700;font-size:18px}
.permis{display:flex;gap:4px}
.pm{font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pm.on{background:var(--ok);border-color:var(--ok);color:#fff}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.num{text-align:right}
.rank{font-family:var(--display);font-weight:800;font-size:20px;width:40px}
.hold{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.dot{width:18px;height:18px;border-radius:50% 46% 52% 44%;border:2px solid rgba(0,0,0,.25);flex:none}
.voies{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.vbtn{border:2px solid transparent;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.vbtn .c{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.vbtn .n{font-size:12px;opacity:.85}
.vbtn[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.vbtn.done{box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:9px 12px;font-weight:700;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:14px 0 6px}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:88vh}}
.sheet h3{font-family:var(--display);font-size:26px;margin:0}
.warn{color:var(--warn);font-weight:700;font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.li .grow{flex:1;min-width:0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2)}
.tag.ok{background:var(--ok);color:#fff}.tag.rp{background:var(--warn);color:#fff}.tag.ko{background:var(--bad);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.panel h3{font-family:var(--display);font-size:20px;margin:0}
.panel p{margin:0;color:var(--muted);font-size:14px}
code{font-size:13px;background:var(--surface2);padding:1px 5px;border-radius:4px}
input[type=text],input[type=number],select.in{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:700;max-width:90vw}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:21px}
.empty{padding:30px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.podium div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.podium .p{font-family:var(--display);font-weight:800;font-size:30px;color:var(--accent);line-height:1}
.dim{opacity:.45}
.plan{position:relative;width:100%;max-width:100%;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface2);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.plan img{display:block;width:100%;height:auto;pointer-events:none}
.plan.schema{aspect-ratio:var(--ratio,1.7);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 12.5%,linear-gradient(90deg,var(--line) 2px,transparent 2px) 0 0/12.5% 100%,var(--surface2)}
.plan.placing{cursor:crosshair;outline:3px dashed var(--accent);outline-offset:-3px}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 6px;border-radius:15px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;white-space:nowrap}
button.mk{cursor:pointer}
.mk.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:3;transform:translate(-50%,-50%) scale(1.18)}
.mk.done::after{content:"✓";position:absolute;right:-7px;top:-7px;background:var(--ok);color:#fff;border:2px solid #fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.mk.faded{opacity:.38}
.mk.off{opacity:.45;border-style:dashed}
.ck{position:absolute;transform:translate(-50%,-50%);background:var(--surface);color:var(--ink);border:2px solid #fff;border-radius:9px;box-shadow:0 1px 5px rgba(0,0,0,.6);padding:3px 5px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;white-space:nowrap}
button.ck{cursor:pointer}
.ck .dots{display:flex;gap:2px}
.ck .dots i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.ck .dots i.u{opacity:.28}
.ck.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:3}
.ck .badge{position:absolute;right:-9px;top:-9px;background:var(--ok);color:#fff;border:2px solid #fff;border-radius:99px;font-size:11px;padding:1px 4px;font-family:var(--body)}
.ck.off{opacity:.45;border-style:dashed}
.chip .dots{display:inline-flex;gap:2px}.chip .dots i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badges.compact{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:10px 6px;border-radius:12px;border:1px dashed var(--line);background:var(--surface);opacity:.45;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.badge .bi{font-size:28px;line-height:1}
.badge .bn{font-weight:700;font-size:13px;line-height:1.2}
.badge .bd{font-size:11px;color:var(--muted);line-height:1.25}
.bcount{font-size:13px;font-weight:700;color:var(--muted)}
.celebrate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,14,12,.6);padding:20px;cursor:pointer}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.celcard{position:relative;background:var(--surface);border:3px solid var(--gold);border-radius:20px;padding:22px 26px;text-align:center;max-width:420px;width:100%;animation:pop .5s cubic-bezier(.2,1.6,.4,1);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.celt{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent);text-transform:uppercase}
.celn{font-weight:700;font-size:20px;margin-top:6px}
.celcot{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.celcot span{color:var(--muted)}.celcot .to{color:var(--ink)}.celcot b{color:var(--gold)}
.celp{display:inline-block;margin-top:12px;background:var(--ok);color:#fff;font-weight:700;padding:5px 12px;border-radius:99px}
.celb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.celb .badge{min-width:110px}
.recstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid var(--gold);border-radius:var(--r);padding:8px 12px;margin-bottom:12px}

.pm.fl{font-weight:800}
.fsel{display:flex;align-items:center;gap:5px;flex-wrap:wrap}

.fname{font-weight:700;font-size:13px;min-width:38px;text-transform:capitalize}
.fdate{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;max-width:140px}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fcard{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);overflow:hidden}

.fcard textarea{width:100%;min-height:120px;border:0;border-top:1px solid var(--line);padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);resize:vertical}
.search{position:relative}

.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}

.results button:hover,.results button:focus-visible{border-color:var(--accent)}
.results mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:3px}
.bk{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);border:2px solid #fff;border-radius:5px;padding:3px 6px 2px;box-shadow:0 1px 5px rgba(0,0,0,.6);font-family:var(--display);font-weight:800;font-size:14px;line-height:1;white-space:nowrap;display:flex;flex-direction:column;align-items:center}

.bk small{font-size:9px;color:var(--gold);letter-spacing:-1px}
.bk.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:3}

.bk.faded,.bk.off{opacity:.35}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.bcard:hover{border-color:var(--accent)}

.defi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:16px}

<script>
"use strict";
/* ---------- stockage ---------- */
const KEY="grimpe-eps-v1";
const APP_VERSION="11 · progrès & badges";
const COULEURS={rouge:"#d7372b",orange:"#ef7d1a",jaune:"#f2c624",vert:"#2f9e4f","vert clair":"#7cc455","vert fonce":"#1e6b35",bleu:"#2a6fdb","bleu clair":"#5fb4ec","bleu fonce":"#1c3f8f",violet:"#7b46c2",mauve:"#a77bd4",rose:"#e65a9b",fuchsia:"#c21f7a",noir:"#1e1e1e",blanc:"#f7f7f2",gris:"#8a8f8c",marron:"#8a5a33",turquoise:"#1aa6a0",beige:"#d9c6a0",or:"#c9a227",kaki:"#7a7a3a"};
let S=null;
const uid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function save(){const ok=saveLocal();scheduleSync();return ok}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){if(e&&(e.name==="QuotaExceededError"||e.code===22||e.code===1014)){toast("Mémoire de l'appareil pleine : supprimez une photo du mur ou d'anciennes données.");return false}return true}}
function load(){try{const t=localStorage.getItem(KEY);if(t)return JSON.parse(t)}catch(e){}return null}
function demo(){
  const cid=uid();
  const noms=[["MARTIN","Léa"],["BERNARD","Hugo"],["DUBOIS","Inès"],["LEROY","Nathan"],["MOREAU","Chloé"],["SIMON","Yanis"],["LAURENT","Manon"],["LEFEBVRE","Enzo"]];
  const eleves=noms.map(([n,p],i)=>({id:uid(),nom:n,prenom:p,permis:{grimper:i<6,assurer:i<5,tete:i<2}}));
  const vs=[["1","jaune","4a","A",8,"1"],["2","vert","4b","A",8,"1"],["3","bleu","4c","A",8,"1"],["4","rouge","5a","A",9,"2"],["5","orange","5b","A",9,"2"],["6","noir","5c","A",9,"2"],["7","violet","6a","B",11,"3"],["8","rose","4c","B",11,"3"],["9","blanc","5a+","B",11,"3"],["10","jaune","6b","B",11,"4"],["11","vert","5b","B",11,"4"],["12","bleu","6a+","B",11,"4"]];
  const voies=vs.map(([num,couleur,cotation,secteur,hauteur,corde])=>({id:uid(),num,couleur,cotation,secteur,hauteur,corde,active:true}));
  const pass=[];const d=new Date().toISOString();
  const add=(e,v,mode,res,a)=>pass.push({id:uid(),classeId:cid,eleveId:eleves[e].id,voieId:voies[v].id,mode,res,assureurId:a==null?null:eleves[a].id,date:d});
  add(0,3,"moul","ok",1);add(0,4,"moul","ok",1);add(0,6,"tete","repos",1);add(1,3,"moul","ok",0);add(1,5,"moul","ok",0);
  add(2,2,"moul","ok",3);add(3,1,"moul","ok",2);add(3,3,"moul","repos",2);add(4,0,"moul","ok",5);add(5,1,"moul","echec",4);
  const pos={};const plans=[demoPlan(voies,pos)];
  return {classes:[{id:cid,nom:"5e Exemple",eleves}],voies,passages:pass,plans,pos,reglages:{bonusTete:50,repos:50,uneFoisParVoie:true},classeId:cid,demo:true,tab:"seance"};
}
function demoPlan(voies,pos){
  const pid=uid();
  voies.forEach((v,i)=>{if(!v.corde)v.corde=String(Math.floor(i/3)+1);delete v.pos});
  [...new Set(voies.map(v=>v.corde))].forEach((c,i,a)=>{pos["c:"+c]={[pid]:{x:+(100*(i+0.5)/a.length).toFixed(1),y:55}}});
  return {id:pid,nom:"Mur (schéma)",img:null,ratio:1.7};
}
function fixReg(r){r=Object.assign({bonusTete:50,repos:50,uneFoisParVoie:true},r||{});r.progres=Object.assign({on:true,premiere:20,record:15,premierBloc:10,recordBloc:10},r.progres||{});return r}
function migrate(){
  S.plans=S.plans||[];S.pos=S.pos||{};S.blocs=S.blocs||[];S.blocPass=S.blocPass||[];
  (S.classes||[]).forEach(c=>c.eleves.forEach(e=>{const p=e.permis=e.permis||{};
    if(p.assurer===true)p.assurer=1;else if(!p.assurer)p.assurer=0;else p.assurer=Math.max(0,Math.min(4,+p.assurer||0));
    p.grimper=p.grimper===true||(+p.grimper||0)>0;
    p.tete=!!p.tete;p.dates=p.dates||{};p.dates.assurer=p.dates.assurer||{};
    if(p.dates.grimper&&typeof p.dates.grimper==="object"){const v=Object.values(p.dates.grimper).filter(Boolean).sort();p.dates.grimper=v[0]||""}}));
  if(S.cordes){for(const k in S.cordes){const c=S.cordes[k];if(c&&c.plan)(S.pos["c:"+k]=S.pos["c:"+k]||{})[c.plan]={x:c.x,y:c.y}}delete S.cordes}
  (S.voies||[]).forEach(v=>{if(v.pos&&v.pos.plan)(S.pos[v.id]=S.pos[v.id]||{})[v.pos.plan]={x:v.pos.x,y:v.pos.y};delete v.pos});
}
S=load()||demo();
migrate();
if(S.demo&&(!S.plans.length||!S.voies.some(v=>v.corde))){S.pos={};S.plans=[demoPlan(S.voies,S.pos)]}
S.reglages=fixReg(S.reglages);

/* ---------- cotations & points ---------- */
function cotIndex(c){const m=norm(c).replace(/\s/g,"").match(/^([3-9])([abc])?(\+)?/);if(!m)return -1;return (m[1]-3)*6+({a:0,b:2,c:4}[m[2]||"a"])+(m[3]?1:0)}
function basePts(c){const i=cotIndex(c);return i<0?5:10+i*3}
function passPts(p,v){if(!v||p.res==="echec")return 0;let x=basePts(v.cotation);if(p.mode==="tete")x*=1+S.reglages.bonusTete/100;if(p.res==="repos")x*=S.reglages.repos/100;return Math.round(x)}
function couleurHex(c){const k=norm(c);if(COULEURS[k])return COULEURS[k];const f=Object.keys(COULEURS).find(x=>k.startsWith(x));if(f)return COULEURS[f];if(/^#([0-9a-f]{3}){1,2}$/.test(k))return k;return "#9aa29d"}
function inkOn(hex){const h=hex.replace("#","");const f=h.length===3?h.split("").map(x=>x+x).join(""):h;const r=parseInt(f.slice(0,2),16),g=parseInt(f.slice(2,4),16),b=parseInt(f.slice(4,6),16);return (r*299+g*587+b*114)/1000>150?"#141414":"#ffffff"}
const voieById=id=>S.voies.find(v=>v.id===id);
const classe=()=>S.classes.find(c=>c.id===S.classeId)||S.classes[0];
const eleveById=id=>{for(const c of S.classes){const e=c.eleves.find(x=>x.id===id);if(e)return e}return null};
const fullName=e=>e?`${e.prenom} ${e.nom}`.trim():"—";

function stats(e,since){
  const ps=S.passages.filter(p=>p.eleveId===e.id&&(!since||p.date>=since));
  const best={};let pts=0;
  for(const p of ps){const v=voieById(p.voieId);const x=passPts(p,v);
    if(S.reglages.uneFoisParVoie){if(!(p.voieId in best)||x>best[p.voieId])best[p.voieId]=x}else pts+=x}
  if(S.reglages.uneFoisParVoie)pts=Object.values(best).reduce((a,b)=>a+b,0);
  const oks=ps.filter(p=>p.res==="ok");
  const reussies=new Set(oks.map(p=>p.voieId)).size;
  let maxI=-1,maxC="—";for(const p of oks){const v=voieById(p.voieId);if(v&&cotIndex(v.cotation)>maxI){maxI=cotIndex(v.cotation);maxC=v.cotation}}
  const tete=new Set(oks.filter(p=>p.mode==="tete").map(p=>p.voieId)).size;
  const hauteur=oks.reduce((a,p)=>a+(+(voieById(p.voieId)||{}).hauteur||0),0);
  const assure=S.passages.filter(p=>p.assureurId===e.id&&(!since||p.date>=since)).length;
  const bp=(S.blocPass||[]).filter(p=>p.eleveId===e.id&&(!since||p.date>=since));
  const bok=[...new Set(bp.filter(p=>p.res==="ok").map(p=>p.blocId))].map(blocById).filter(Boolean);
  const bPts=bok.reduce((a,b)=>a+blocPts(b),0);const blocMax=bok.reduce((a,b)=>Math.max(a,+b.niveau||1),0);
  const pev=progEvents(e).filter(x=>!since||x.date>=since);const PR=S.reglages.progres||{};
  const progPts=PR.on===false?0:pev.reduce((a,x)=>a+x.pts,0);
  return {pts:pts+bPts+progPts,ptsVoies:pts,blocPts:bPts,progPts,records:pev.filter(x=>x.t==="record").length,blocs:bok.length,blocMax,reussies,maxI,maxC,tete,hauteur,assure,essais:ps.length+bp.length}
}
/* ---------- progrès, records perso, badges ---------- */
function progEvents(e){
  const PR=S.reglages.progres||{};const ev=[];
  const ok=S.passages.filter(p=>p.eleveId===e.id&&p.res==="ok").sort((a,b)=>a.date.localeCompare(b.date));
  let max=-1,maxL="";
  for(const p of ok){const v=voieById(p.voieId);if(!v)continue;const i=cotIndex(v.cotation);
    if(max<0&&maxL===""){ev.push({t:"premiere",date:p.date,pts:+PR.premiere||0,a:v.cotation,pid:p.id,label:"Première voie en haut"});max=i;maxL=v.cotation;continue}
    if(i>max){ev.push({t:"record",date:p.date,pts:+PR.record||0,de:maxL,a:v.cotation,pid:p.id,label:`Record perso : ${maxL} → ${v.cotation}`});max=i;maxL=v.cotation}}
  const bok=(S.blocPass||[]).filter(p=>p.eleveId===e.id&&p.res==="ok").sort((a,b)=>a.date.localeCompare(b.date));let bmax=0;
  for(const p of bok){const b=blocById(p.blocId);if(!b)continue;const n=+b.niveau||1;
    if(!bmax){ev.push({t:"premierBloc",date:p.date,pts:+PR.premierBloc||0,a:etoiles(n),pid:p.id,label:"Premier bloc réussi"});bmax=n;continue}
    if(n>bmax){ev.push({t:"recordBloc",date:p.date,pts:+PR.recordBloc||0,de:etoiles(bmax),a:etoiles(n),pid:p.id,label:`Record bloc : ${etoiles(bmax)} → ${etoiles(n)}`});bmax=n}}
  return ev;
}
function progression(e,since){
  const ok=S.passages.filter(p=>p.eleveId===e.id&&p.res==="ok").map(p=>({p,v:voieById(p.voieId)})).filter(x=>x.v).sort((a,b)=>a.p.date.localeCompare(b.p.date));
  if(!ok.length)return null;
  const before=since?ok.filter(x=>x.p.date<since):[];const during=since?ok.filter(x=>x.p.date>=since):ok;if(!during.length)return null;
  const best=a=>a.reduce((m,x)=>cotIndex(x.v.cotation)>cotIndex(m.v.cotation)?x:m,a[0]);
  const from=before.length?best(before):during[0];const to=best(before.concat(during));
  return {from:from.v.cotation,to:to.v.cotation,gain:Math.max(0,cotIndex(to.v.cotation)-cotIndex(from.v.cotation))};
}
const BADGES=[
  {id:"sommet",ic:"⛰️",n:"Premier sommet",d:"Enchaîner sa première voie",t:x=>x.reussies>=1},
  {id:"record",ic:"🚀",n:"Record battu",d:"Battre son record de cotation",t:x=>x.recordsAll>=1},
  {id:"record3",ic:"📈",n:"Toujours plus haut",d:"Battre 3 fois son record",t:x=>x.recordsAll>=3},
  {id:"perse",ic:"💪",n:"Persévérant",d:"Enchaîner une voie après 2 essais manqués dessus",t:x=>x.perse},
  {id:"explo5",ic:"🧭",n:"Explorateur",d:"5 voies différentes enchaînées",t:x=>x.reussies>=5},
  {id:"explo15",ic:"🗺️",n:"Grand explorateur",d:"15 voies différentes enchaînées",t:x=>x.reussies>=15},
  {id:"couleurs",ic:"🌈",n:"Arc-en-ciel",d:"Enchaîner des voies de 5 couleurs différentes",t:x=>x.couleurs>=5},
  {id:"regul",ic:"📅",n:"Régulier",d:"Grimper lors de 3 séances différentes",t:x=>x.jours>=3},
  {id:"assidu",ic:"🔥",n:"Assidu",d:"Grimper lors de 6 séances différentes",t:x=>x.jours>=6},
  {id:"hauteur",ic:"🏔️",n:"Cent mètres",d:"Grimper 100 m au total",t:x=>x.hauteur>=100},
  {id:"tete",ic:"🧗",n:"Premier de cordée",d:"Enchaîner une voie en tête",t:x=>x.tete>=1},
  {id:"bloc3",ic:"🧩",n:"Bloqueur",d:"Réussir 3 blocs",t:x=>x.blocs>=3},
  {id:"assure10",ic:"🤝",n:"Assureur de confiance",d:"Assurer 10 fois",t:x=>x.assure>=10},
  {id:"foulard",ic:"🧣",n:"Foulard rouge",d:"Obtenir le foulard assureur rouge",t:(x,e)=>(+e.permis.assurer||0)>=4},

function searchResults(q){
  const n=norm(q).replace(/\s+/g," ");if(n.length<2)return "";
  const words=n.split(" ");const out=[];
  for(const c of S.classes)for(const e of c.eleves){const a=norm(e.nom),b=norm(e.prenom);
    const ok=words.every(w=>a.split(/[\s-]+/).some(x=>x.startsWith(w))||b.split(/[\s-]+/).some(x=>x.startsWith(w))||a.startsWith(w)||b.startsWith(w));
    if(ok)out.push({e,c})}
  if(!out.length)return `<p class="sub" style="margin:4px 0">Aucun élève trouvé pour « ${esc(q)} ».</p>`;
  const hi=t=>{let r=esc(t);words.forEach(w=>{const i=norm(t).indexOf(w);if(i===0||(i>0&&/[\s-]/.test(t[i-1])))r=esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+w.length))+"</mark>"+esc(t.slice(i+w.length))});return r};
  return out.sort((x,y)=>(x.e.nom+x.e.prenom).localeCompare(y.e.nom+y.e.prenom,"fr")).slice(0,25).map(({e,c})=>`<button data-act="openeleve" data-id="${e.id}"><span><b>${hi(e.nom)}</b> ${hi(e.prenom)}</span><span class="tag">${esc(c.nom)}</span><span style="margin-left:auto">${pmBadges(e)}</span></button>`).join("")+(out.length>25?`<p class="sub">… ${out.length-25} autres : précisez la recherche.</p>`:"");
}

/* ---------- roulette ---------- */
const RL={niv:"",mode:"exact",eleveId:"",excl:true,cur:null,res:null,spin:false,planId:null};
function rCandidats(){
  const e=RL.eleveId?eleveById(RL.eleveId):null;const t=cotIndex(RL.niv);
  const done=e?new Set(S.passages.filter(p=>p.eleveId===e.id&&p.res==="ok").map(p=>p.voieId)):new Set();
  if(!RL.niv)return [];
  return S.voies.filter(v=>v.active&&(RL.mode==="exact"?norm(v.cotation).replace(/\s/g,"")===norm(RL.niv).replace(/\s/g,""):(t>=0&&Math.abs(cotIndex(v.cotation)-t)<=2))&&!(e&&RL.excl&&done.has(v.id)));
}
function rPlan(c){
  const want=RL.res||RL.cur;
  const withRes=want?S.plans.filter(p=>placedOn(itemOf(want),p.id)):[];
  if(RL.planId&&withRes.some(p=>p.id===RL.planId))return planById(RL.planId);
  if(withRes.length&&!RL.spin)return withRes.sort((a,b)=>score(b)-score(a))[0];
  function score(p){return c.filter(v=>placedOn(itemOf(v),p.id)).length}
  const best=[...S.plans].sort((a,b)=>score(b)-score(a))[0];
  return best&&score(best)?best:null;
}
function stageHTML(part){
  const c=rCandidats();const v=RL.cur;const e=RL.eleveId?eleveById(RL.eleveId):null;
  let card;
  if(!v)card=`<div class="rcard wait"><span class="big">?</span><span class="meta">${RL.niv?`${c.length} voie${c.length>1?"s":""} possible${c.length>1?"s":""}`:"Choisissez d'abord un niveau"}<small>${RL.niv?"Lancez la roulette !":""}</small></span></div>`;
  else{const h=couleurHex(v.couleur);const fin=!RL.spin&&RL.res&&RL.res.id===v.id;
    card=`<div class="rcard ${fin?"land":""}" style="background:${h};color:${inkOn(h)}"><span class="big">${esc(v.cotation)}</span><span class="meta">${cordeKey(v)?`Corde ${esc(cordeLabel(cordeKey(v)))}`:`Voie n°${esc(v.num)}`}<small>prises ${esc(v.couleur)}${cordeKey(v)?` · voie n°${esc(v.num)}`:""}${v.secteur?` · secteur ${esc(v.secteur)}`:""}</small>${fin&&e?`<small>pour ${esc(fullName(e))}</small>`:""}</span></div>`}
  const pl=rPlan(c);
  const plans=S.plans.filter(p=>c.some(x=>placedOn(itemOf(x),p.id)));
  const chips=plans.length>1&&!RL.spin?`<div class="chips">${plans.map(p=>`<button class="chip" data-act="rplan" data-id="${p.id}" aria-pressed="${pl&&p.id===pl.id}">${esc(p.nom)}</button>`).join("")}</div>`:"";
  const fin=!RL.spin&&RL.res;
  const show=card+chips+(pl?planHTML(pl,{ctx:"view",sel:v?v.id:null,only:new Set(c.map(x=>x.id))}):"");
  if(part==="show")return show;
  const btns=`<div id="rBtns" class="stage" style="margin:0">${spinBtnHTML(c)}${fin&&e?`<div class="row"><button class="btn pri" data-act="rnoter">Noter le passage de ${esc(e.prenom)}</button></div>`:""}${fin&&!e?`<p class="sub" style="margin:0">Choisissez l'élève en haut pour noter le passage directement.</p>`:""}</div>`;
  return btns+`<div id="rShow" class="stage" style="margin:0">${show}</div>`;
}
let WHEEL="";
function wheelSVG(){if(WHEEL)return WHEEL;const cols=["#f2c624","#2f9e4f","#7b46c2","#2a9fe0","#d7372b","#1e1e1e","#8a8f8c","#ef7d1a"];const n=cols.length;let p="";
  for(let i=0;i<n;i++){const a0=(i/n)*2*Math.PI-Math.PI/2,a1=((i+1)/n)*2*Math.PI-Math.PI/2;
    p+=`<path d="M50 50 L${(50+48*Math.cos(a0)).toFixed(2)} ${(50+48*Math.sin(a0)).toFixed(2)} A48 48 0 0 1 ${(50+48*Math.cos(a1)).toFixed(2)} ${(50+48*Math.sin(a1)).toFixed(2)} Z" fill="${cols[i]}" stroke="#fff" stroke-width="2"/>`}
  return WHEEL=`<svg viewBox="0 0 100 100"><g class="rot">${p}<circle cx="50" cy="50" r="11" fill="#fff"/><circle cx="50" cy="50" r="5" fill="#1b2320"/></g></svg>`}
function spinBtnHTML(c){
  const lab=RL.spin?"Ça tourne…":RL.res?"Relancer !":"Lancer la roulette";
  const sub=RL.spin?"Croisez les doigts…":c.length?`${c.length} voie${c.length>1?"s":""} en jeu`:RL.niv?"aucune voie à ce niveau":"choisissez un niveau";
  return `<button class="spinbtn ${RL.spin?"spinning":""}" data-act="spin" ${RL.spin||!c.length?"disabled":""}><span class="wheel" aria-hidden="true">${wheelSVG()}<i class="needle"></i></span><span class="lbl">${lab}<small>${sub}</small></span></button>`;
}
function drawStage(part){if(part==="show"){const el=$("#rShow");if(el){el.innerHTML=stageHTML("show");return}}const el=$("#rStage");if(el)el.innerHTML=stageHTML()}
function vRoulette(){
  const c=classe();if(RL.eleveId&&!(c&&c.eleves.some(e=>e.id===RL.eleveId))){RL.eleveId="";RL.res=RL.cur=null}
  const cots=[...new Set(S.voies.filter(v=>v.active).map(v=>v.cotation.trim()))].sort((a,b)=>cotIndex(a)-cotIndex(b)||a.localeCompare(b));
  const t=cotIndex(RL.niv);const near=cots.filter(x=>Math.abs(cotIndex(x)-t)<=2);
  const opts=c?sortedEleves(c).map(e=>`<option value="${e.id}" ${RL.eleveId===e.id?"selected":""}>${esc(fullName(e))}</option>`).join(""):"";
  return `<h2>Roulette</h2><p class="sub">L'élève choisit son niveau, la roulette lui attribue une voie au hasard sur le plan.</p>
  <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><label>Élève (facultatif)<select class="in" id="rEleve"><option value="">— Sans élève —</option>${opts}</select></label></div>
  <div class="lab">Niveau souhaité</div>
  <div class="chips">${cots.map(x=>`<button class="chip" data-act="rniv" data-v="${esc(x)}" aria-pressed="${norm(RL.niv)===norm(x)}">${esc(x)}</button>`).join("")||'<span class="sub">Aucune voie active : importez vos voies.</span>'}</div>
  <div class="row" style="margin-top:10px"><span class="seg"><button data-act="rmode" data-v="exact" aria-pressed="${RL.mode==="exact"}">Ce niveau exactement</button><button data-act="rmode" data-v="proche" aria-pressed="${RL.mode==="proche"}">${RL.niv&&near.length?`Proche (${esc(near[0])} à ${esc(near[near.length-1])})`:"Niveau proche"}</button></span>
  ${RL.eleveId?`<span class="row" style="gap:8px"><button class="sw" role="switch" aria-checked="${RL.excl}" data-act="rexcl" aria-label="Exclure les voies déjà enchaînées"></button>Exclure les voies déjà enchaînées</span>`:""}</div>
  <div class="stage" id="rStage">${stageHTML()}</div>`;
}
function spin(){
  const c=rCandidats();if(!c.length)return toast("Aucune voie disponible pour ce niveau");
  RL.res=c[Math.floor(Math.random()*c.length)];RL.planId=null;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const n=reduce||c.length===1?1:Math.min(34,16+c.length*2);const seq=[];let prev=null;
  for(let i=0;i<n-1;i++){let x;do{x=c[Math.floor(Math.random()*c.length)]}while(c.length>1&&x===prev);seq.push(x);prev=x}
  if(seq.length&&seq[seq.length-1]===RL.res&&c.length>1)seq.pop();
  seq.push(RL.res);RL.spin=true;let i=0,d=20;
  drawStage();
  (function tick(){RL.cur=seq[i];i++;if(i>=seq.length){RL.spin=false;drawStage()}else drawStage("show");if(i<seq.length){d=Math.min(d*1.13,210);setTimeout(tick,d)}})();
}

/* ---------- meilleurs grimpeurs ---------- */
const nivOf=c=>{const m=String(c.nom).match(/^\s*(\d)/);return m?m[1]+"e":""};
const court=e=>`${esc(e.prenom)} ${esc(String(e.nom||"").charAt(0))}.`;
function vTop(){
  const per=S.topPer||"all",niv=S.topNiv||"";
  const since=per==="all"?null:new Date(Date.now()-(+per)*864e5).toISOString();
  const niveaux=[...new Set(S.classes.map(nivOf).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
  const cls=S.classes.filter(c=>!niv||nivOf(c)===niv);
  const filt=`<div class="row" style="margin-bottom:12px">
    <span class="seg"><button data-act="topper" data-v="all" aria-pressed="${per==="all"}">Depuis le début</button><button data-act="topper" data-v="30" aria-pressed="${per==="30"}">30 jours</button><button data-act="topper" data-v="7" aria-pressed="${per==="7"}">7 jours</button></span>
    ${niveaux.length>1?`<span class="seg"><button data-act="topniv" data-v="" aria-pressed="${!niv}">Tous</button>${niveaux.map(n=>`<button data-act="topniv" data-v="${n}" aria-pressed="${niv===n}">${n}</button>`).join("")}</span>`:""}
    <button class="btn" data-act="tv" style="margin-left:auto">${document.body.classList.contains("tv")?"Quitter le grand écran":"Grand écran"}</button></div>`;
  const head=`<h2>Meilleurs grimpeurs${niv?" · "+niv:""}</h2><p class="sub">Toutes les classes${niv?" de "+niv:""} réunies${per==="all"?"":` · ${per} derniers jours`}. Prénom et initiale du nom seulement, pour l'affichage en classe.</p>`;
  const rows=cls.flatMap(c=>c.eleves.map(e=>({e,c,s:Object.assign(stats(e,since),{nbadges:badgesOf(e).length})}))).filter(r=>r.s.essais>0||r.s.assure>0);
  if(!rows.length)return head+filt+`<div class="empty">Aucune voie enregistrée sur cette période. Les meilleurs grimpeurs apparaîtront dès les premiers passages notés en séance.</div>`;
  const byPts=[...rows].sort((a,b)=>b.s.pts-a.s.pts||b.s.maxI-a.s.maxI||b.s.reussies-a.s.reussies);
  const step=(r,i)=>r?`<div class="step s${i+1}"><span class="medal m${i+1}">${i+1}</span><span class="who">${court(r.e)}</span><span class="cl">${esc(r.c.nom)}</span><span class="val">${r.s.pts}<small> pts</small></span><span class="cl">niveau ${esc(r.s.maxC)}</span></div>`:`<div></div>`;
  const podium=`<div class="top3">${step(byPts[1],1)}${step(byPts[0],0)}${step(byPts[2],2)}</div>`;
  const prog=rows.map(r=>({...r,pg:progression(r.e,since)})).filter(r=>(r.pg&&r.pg.gain>0)||r.s.progPts>0)
    .sort((a,b)=>((b.pg?b.pg.gain:0)-(a.pg?a.pg.gain:0))||(b.s.progPts-a.s.progPts)).slice(0,10);
  const progHTML=prog.length?`<div class="lab" style="margin-top:4px">📈 Plus belle progression${per==="all"?"":` · ${per} jours`}</div><div class="tbl" style="margin-bottom:22px"><table><thead><tr><th>#</th><th>Grimpeur</th><th>Classe</th><th>Progression</th><th>Records</th><th>Pts progrès</th></tr></thead><tbody>${prog.map((r,i)=>`<tr><td class="rank">${i+1}</td><td><b>${court(r.e)}</b></td><td>${esc(r.c.nom)}</td><td>${r.pg&&r.pg.gain>0?`<b>${esc(r.pg.from)} → ${esc(r.pg.to)}</b>`:"—"}</td><td class="num">${r.s.records||"—"}</td><td class="num"><b>${r.s.progPts}</b></td></tr>`).join("")}</tbody></table></div>`:"";
  const rest=byPts.slice(3,15).map((r,i)=>`<tr><td class="rank">${i+4}</td><td><b>${court(r.e)}</b></td><td>${esc(r.c.nom)}</td><td class="num"><b>${r.s.pts}</b></td><td><b>${esc(r.s.maxC)}</b></td><td class="num">${r.s.reussies}</td></tr>`).join("");
  const rec=(k,label,fmt,unit)=>{const best=Math.max(...rows.map(r=>r.s[k]));if(!(best>0))return "";
    const who=rows.filter(r=>r.s[k]===best);const shown=who.slice(0,3).map(r=>`${court(r.e)} <span>${esc(r.c.nom)}</span>`).join("<br>");
    return `<div class="rec"><span class="k">${label}</span><span class="v">${fmt(who[0])}${unit?`<small> ${unit}</small>`:""}</span><span class="n">${shown}${who.length>3?`<br><span>+ ${who.length-3} autre${who.length>4?"s":""}</span>`:""}</span></div>`};
  const records=[rec("maxI","Plus haute cotation",r=>esc(r.s.maxC)),rec("reussies","Voies enchaînées",r=>r.s.reussies),rec("tete","Voies en tête",r=>r.s.tete),rec("blocs","Blocs réussis",r=>r.s.blocs),rec("nbadges","Collection de badges",r=>r.s.nbadges,"badges"),
    rec("hauteur","Mètres grimpés",r=>r.s.hauteur,"m"),rec("assure","Meilleur assureur",r=>r.s.assure,"assurages")].join("");
  const ids=new Map();cls.forEach(c=>c.eleves.forEach(e=>ids.set(e.id,{e,c})));
  const firsts=[...S.voies].sort((a,b)=>cotIndex(b.cotation)-cotIndex(a.cotation)).map(v=>{
    const ok=S.passages.filter(p=>p.voieId===v.id&&p.res==="ok"&&ids.has(p.eleveId)).sort((a,b)=>a.date.localeCompare(b.date));
    return ok.length?{v,p:ok[0],n:new Set(ok.map(x=>x.eleveId)).size}:null}).filter(Boolean).slice(0,6);
  const fl=firsts.map(f=>{const w=ids.get(f.p.eleveId);return `<div class="li">${hold(f.v)}<b>${esc(f.v.cotation)}</b>${cordeKey(f.v)?`<span class="tag">${esc(cordeLabel(cordeKey(f.v)))}</span>`:""}<span class="grow">1<sup>re</sup> : <b>${court(w.e)}</b> (${esc(w.c.nom)}) le ${new Date(f.p.date).toLocaleDateString("fr-FR")}${f.p.mode==="tete"?" en tête":""}</span><span class="tag">${f.n} élève${f.n>1?"s":""} depuis</span></div>`}).join("");
  const cr=cls.map(c=>{const st=c.eleves.map(e=>stats(e,since));if(!st.length)return null;const act=st.filter(x=>x.essais>0).length;
    const mi=Math.max(-1,...st.map(x=>x.maxI));const mc=(st.find(x=>x.maxI===mi)||{}).maxC||"—";
    return {c,moy:Math.round(st.reduce((a,x)=>a+x.pts,0)/st.length),voies:st.reduce((a,x)=>a+x.reussies,0),mc,act,n:st.length}}).filter(Boolean).sort((a,b)=>b.moy-a.moy);
  const ctab=cr.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(x.c.nom)}</b></td><td class="num"><b>${x.moy}</b></td><td class="num">${x.voies}</td><td><b>${esc(x.mc)}</b></td><td class="num">${x.act}/${x.n}</td></tr>`).join("");
  return head+filt+podium+progHTML
    +(rest?`<div class="tbl" style="margin-bottom:22px"><table><thead><tr><th>#</th><th>Grimpeur</th><th>Classe</th><th>Points</th><th>Niveau</th><th>Voies</th></tr></thead><tbody>${rest}</tbody></table></div>`:"")
    +(records?`<div class="lab">Records</div><div class="records">${records}</div>`:"")
    +(fl?`<div class="lab" style="margin-top:22px">Premières ascensions des voies les plus dures</div><div class="list">${fl}</div>`:"")
    +(cr.length>1?`<div class="lab" style="margin-top:22px">Classement des classes</div><div class="tbl"><table><thead><tr><th>#</th><th>Classe</th><th>Moyenne pts / élève</th><th>Voies enchaînées</th><th>Meilleur niveau</th><th>Élèves actifs</th></tr></thead><tbody>${ctab}</tbody></table></div>`:"");
}

/* ---------- plan du mur ---------- */
let planSel=null;
const planById=id=>S.plans.find(p=>p.id===id);
const cordeKey=v=>String(v.corde??"").trim();
const cordeLabel=n=>/^\d+$/.test(String(n))?"C"+n:String(n);
const byNum=(a,b)=>String(a.num).localeCompare(String(b.num),"fr",{numeric:true});
function cordesList(onlyActive){const m={};S.voies.forEach(v=>{const k=cordeKey(v);if(k&&(!onlyActive||v.active))(m[k]=m[k]||[]).push(v)});
  return Object.keys(m).sort((a,b)=>a.localeCompare(b,"fr",{numeric:true})).map(k=>({name:k,voies:m[k].sort(byNum)}))}
const itemOf=v=>cordeKey(v)?"c:"+cordeKey(v):v.id;
const placedOn=(it,pid)=>(S.pos[it]||{})[pid]||null;

async function compressImg(file,maxSide,q){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Image illisible : utilisez une photo JPEG ou PNG."));i.src=url});
    const k=Math.min(1,(maxSide||1600)/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement("canvas");
    cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return {img:cv.toDataURL("image/jpeg",q||0.72),ratio:cv.width/cv.height}}
  finally{URL.revokeObjectURL(url)}
}

    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=ch}

  const relMap={};for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){const id=(m[0].match(/Id="([^"]+)"/)||[])[1],tg=(m[0].match(/Target="([^"]+)"/)||[])[1];if(id)relMap[id]=tg}

  for(const m of wb.matchAll(/<(?:\w+:)?sheet\b[^>]*>/g)){const nm=unx((m[0].match(/name="([^"]*)"/)||[])[1]||"Feuille");const rid=(m[0].match(/r:id="([^"]+)"/)||m[0].match(/\bid="([^"]+)"/)||[])[1];
    let tg=relMap[rid]||"";tg=tg.replace(/^\/?xl\//,"").replace(/^\//,"");const xml=await get("xl/"+tg);if(!xml)continue;
    const rows=[];for(const r of xml.matchAll(/<(?:\w+:)?row\b[^>]*>([\s\S]*?)<\/(?:\w+:)?row>/g)){const row=[];
      for(const c of r[1].matchAll(/<(?:\w+:)?c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?c>)/g)){const at=c[1],body=c[2]||"";const ref=(at.match(/r="([A-Z]+)\d+"/)||[])[1];
        let col=row.length;if(ref){col=0;for(const ch of ref)col=col*26+ch.charCodeAt(0)-64;col--}
        const ty=(at.match(/t="(\w+)"/)||[])[1];const v=(body.match(/<(?:\w+:)?v>([\s\S]*?)<\/(?:\w+:)?v>/)||[])[1];
        let val=ty==="s"?ss[+v]:ty==="inlineStr"?tText(body):v!=null?unx(v):"";row[col]=val??""}
      for(let i=0;i<row.length;i++)if(row[i]==null)row[i]="";if(row.some(x=>String(x).trim()))rows.push(row)}
    out.push({name:nm,rows})}
  if(!out.length)throw new Error("Aucune feuille trouvée dans ce fichier.");return out;
}
function findHeader(rows,keys){for(let i=0;i<Math.min(rows.length,15);i++){const h=rows[i].map(norm);const idx={};for(const [k,alts] of Object.entries(keys)){const j=h.findIndex(x=>alts.some(a=>x===a||(a.length>3&&x.startsWith(a))));if(j>=0)idx[k]=j}if(Object.keys(idx).length>=2||(idx.eleve!=null))return {i,idx}}return null}
const generic=n=>/^(feuil|sheet|feuille|tableau)\s*\d*$/i.test(n.trim());
function importClasses(sheets){
  const keys={classe:["classe","division","groupe"],nom:["nom de famille","nom"],prenom:["prenom"],eleve:["eleve","nom prenom","nom et prenom","nom - prenom"]};
  const forced=($("#clsName")?.value||"").trim();let nE=0;const touched=new Set();
  for(const sh of sheets){const h=findHeader(sh.rows,keys);if(!h)continue;const {i,idx}=h;
    for(const r of sh.rows.slice(i+1)){let nom="",prenom="";
      if(idx.nom!=null&&idx.prenom!=null&&idx.nom!==idx.prenom){nom=String(r[idx.nom]||"").trim();prenom=String(r[idx.prenom]||"").trim()}
      else{const full=String(r[idx.eleve??idx.nom]||"").trim();const w=full.split(/\s+/);const up=w.filter(x=>x===x.toUpperCase()&&/[A-ZÀ-Ý]/.test(x));nom=up.join(" ");prenom=w.filter(x=>!up.includes(x)).join(" ");if(!nom){nom=w[0]||"";prenom=w.slice(1).join(" ")}}
      if(!nom&&!prenom)continue;
      const cn=(forced||(idx.classe!=null?String(r[idx.classe]||"").trim():"")||(generic(sh.name)?"Classe importée":sh.name)).trim();
      let c=S.classes.find(x=>norm(x.nom)===norm(cn));if(!c){c={id:uid(),nom:cn,eleves:[]};S.classes.push(c)}
      touched.add(c.id);
      if(!c.eleves.some(e=>norm(e.nom)===norm(nom)&&norm(e.prenom)===norm(prenom))){c.eleves.push({id:uid(),nom,prenom,permis:{grimper:false,assurer:0,tete:false,dates:{assurer:{}}}});nE++}}}
  if(!touched.size)throw new Error("Colonnes introuvables : il faut au moins Nom et Prénom (ou une colonne Élève).");
  dropDemo();S.classeId=[...touched][0];S.tab="eleves";save();render();toast(`${nE} élèves importés dans ${touched.size} classe${touched.size>1?"s":""}`);
}
function importVoies(sheets){
  const keys={num:["n°","no","num","numero","voie","n"],couleur:["couleur","prise","prises"],cotation:["cotation","cot","niveau","difficulte","grade"],corde:["corde","couloir","ligne","relais","moulinette"],secteur:["secteur","pan","mur","zone"],hauteur:["hauteur","haut"]};
  const list=[];
  for(const sh of sheets){const h=findHeader(sh.rows,keys);if(!h||h.idx.cotation==null)continue;const {i,idx}=h;
    for(const r of sh.rows.slice(i+1)){const cot=String(r[idx.cotation]??"").trim();if(!cot)continue;
      list.push({num:idx.num!=null?String(r[idx.num]??"").trim():"",couleur:idx.couleur!=null?String(r[idx.couleur]??"").trim():"",cotation:cot,corde:idx.corde!=null?String(r[idx.corde]??"").trim():"",secteur:idx.secteur!=null?String(r[idx.secteur]??"").trim():"",hauteur:idx.hauteur!=null?String(r[idx.hauteur]??"").replace(",",".").trim():""})}}
  if(!list.length)throw new Error("Colonne Cotation introuvable dans le fichier.");
  dropDemo();
  if(S.vmode==="remp"){const keep=new Set(S.passages.map(p=>p.voieId));S.voies=S.voies.filter(v=>keep.has(v.id)).map(v=>({...v,active:false}))}
  let add=0,maj=0;list.forEach((o,k)=>{if(!o.num)o.num=String(k+1);const ex=S.voies.find(v=>String(v.num)===o.num);if(ex){Object.assign(ex,o,{active:true});maj++}else{S.voies.push(Object.assign({id:uid(),active:true},o));add++}});
  S.tab="voies";save();render();toast(`${add} voies ajoutées, ${maj} mises à jour`);
}
function dropDemo(){if(S.demo){S.classes=[];S.voies=[];S.passages=[];S.plans=[];S.pos={};S.planId=null;planSel=null;S.demo=false}}


/* ---------- synchronisation des tablettes + code d'accès ---------- */
const ONLINE=(()=>{try{return window.top===window&&(location.protocol==="https:"||location.hostname==="localhost")}catch(e){return false}})();
const LOCAL_KEYS=["tab","classeId","planId","planMode","planLabel","sortKey","topPer","topNiv","voieView","vmode"];
const SK=KEY+"-sync";
let SY={code:null,etag:null,base:null,cfg:null,unlocked:false,busy:false,timer:null,state:"off",msg:""};
try{Object.assign(SY,JSON.parse(localStorage.getItem(SK)||"{}"))}catch(e){}
function persistSY(){const o={code:SY.code,codeLen:SY.codeLen,cfg:SY.cfg,unlocked:SY.unlocked};try{localStorage.setItem(SK,JSON.stringify(Object.assign({etag:SY.etag,base:SY.base},o)))}
  catch(e){try{localStorage.setItem(SK,JSON.stringify(Object.assign({etag:null,base:null},o)))}catch(_){}}}
function payload(){const o={};for(const k in S)if(!LOCAL_KEYS.includes(k))o[k]=S[k];return JSON.parse(JSON.stringify(o))}
function applyRemote(data){const keep={};LOCAL_KEYS.forEach(k=>{if(k in S)keep[k]=S[k]});S=Object.assign({},JSON.parse(JSON.stringify(data)),keep);
  migrate();S.reglages=fixReg(S.reglages);saveLocal()}
const isObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&typeof x.id==="string");
const same=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b);
function merge3(b,l,r){
  if(same(l,b))return r;if(same(r,b))return l;if(same(l,r))return l;
  if((Array.isArray(l)||Array.isArray(r))&&(l===undefined||idArr(l))&&(r===undefined||idArr(r))&&(b===undefined||idArr(b))){
    const B=new Map((b||[]).map(x=>[x.id,x])),L=new Map((l||[]).map(x=>[x.id,x])),Rm=new Map((r||[]).map(x=>[x.id,x]));
    const ids=new Set([...(r||[]).map(x=>x.id),...(l||[]).map(x=>x.id)]);const out=[];
    for(const id of ids){const m=merge3(B.get(id),L.get(id),Rm.get(id));if(m!==undefined)out.push(m)}return out}
  if(isObj(l)&&isObj(r)&&(b===undefined||isObj(b))){const out={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){const m=merge3(b?b[k]:undefined,l[k],r[k]);if(m!==undefined)out[k]=m}return out}
  return l;
}
const hasData=d=>!!(d&&((d.classes||[]).length||(d.voies||[]).length));
async function api(op,extra,code){
  const r=await fetch("/api/sync",{method:"POST",cache:"no-store",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({op,code:code??SY.code},extra||{}))});
  if(r.status===401){const e=new Error("code");e.code=401;throw e}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===409)return {conflict:true};
  if(!r.ok)throw new Error(j.error||("Erreur serveur "+r.status));
  return j;
}
function setSync(st,msg){SY.state=st;SY.msg=msg||"";const b=$("#syncPill");if(!b)return;b.hidden=!ONLINE||!SY.unlocked;
  b.className="pill "+st;b.querySelector("span").textContent={ok:"Synchronisé",busy:"Synchro…",off:"Hors ligne",err:"Erreur synchro"}[st]||"";b.title=msg||b.querySelector("span").textContent}
function scheduleSync(){if(!ONLINE||!SY.unlocked)return;clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,900)}
function chooseFirst(){return new Promise(res=>{
  $("#modal").innerHTML=`<div class="overlay"><div class="sheet" role="alertdialog" style="max-width:520px"><h3>Synchroniser cette tablette</h3>
    <p>Cette tablette a déjà des classes ou des voies, et le serveur aussi. Que voulez-vous faire ?</p>
    <div class="list"><button class="btn pri" data-pick="server">Prendre les données du serveur (recommandé)</button><button class="btn" data-pick="merge">Fusionner les deux</button><button class="btn danger" data-pick="local">Remplacer le serveur par cette tablette</button></div></div></div>`;
  $("#modal").querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{closeModal();res(x.dataset.pick)})})}
function softRender(){
  const ae=document.activeElement;if(RL.spin||(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)&&$("#main").contains(ae))){setTimeout(softRender,1500);return}
  render()}
async function syncNow(){
  if(!ONLINE||!SY.unlocked||SY.busy)return;
  if(!navigator.onLine){setSync("off","Hors ligne : les modifications seront envoyées au retour du réseau.");return}
  SY.busy=true;setSync("busy");
  try{
    for(let tries=0;tries<5;tries++){
      const local=payload();const ls=JSON.stringify(local);
      if(!SY.etag){
        const g=await api("get");
        if(g.empty){if(S.demo||!hasData(local))break;const p=await api("put",{data:local});if(p.conflict)continue;SY.etag=p.etag;SY.base=local;break}
        if(S.demo||!hasData(local)||same(local,g.data)){applyRemote(g.data);SY.etag=g.etag;SY.base=g.data;softRender();break}
        const ch=await chooseFirst();
        if(ch==="server"){applyRemote(g.data);SY.etag=g.etag;SY.base=g.data;softRender();break}
        const data=ch==="merge"?merge3(undefined,local,g.data):local;
        const p=await api("put",{data,etag:g.etag});if(p.conflict)continue;
        if(ch==="merge"){applyRemote(data);softRender()}SY.etag=p.etag;SY.base=data;break;
      }
      if(ls!==JSON.stringify(SY.base)){
        const p=await api("put",{data:local,etag:SY.etag});
        if(p.conflict){const g=await api("get");if(g.empty){SY.etag=null;continue}
          applyRemote(merge3(SY.base,payload(),g.data));SY.etag=g.etag;SY.base=g.data;softRender();continue}
        SY.etag=p.etag;SY.base=local;continue;
      }
      const g=await api("get",{etag:SY.etag});
      if(g.same)break;
      if(g.empty){SY.etag=null;SY.base=null;continue}
      const now=payload();
      applyRemote(JSON.stringify(now)!==ls?merge3(SY.base,now,g.data):g.data);SY.etag=g.etag;SY.base=g.data;softRender();
      if(JSON.stringify(now)!==ls)continue;break;
    }
    persistSY();setSync("ok","Toutes les tablettes partagent les mêmes données.");
  }catch(e){
    if(e.code===401){SY.unlocked=false;persistSY();showLock("Le code d'accès a changé. Entrez le nouveau code.")}
    else setSync(navigator.onLine?"err":"off",e.message||"Synchronisation impossible");
  }finally{SY.busy=false}
}
async function sha(t){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let LK="";
function showLock(msg){LK="";const el=$("#lock");el.hidden=false;
  el.innerHTML=`<div class="lockbox"><div class="brand" style="font-size:34px"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:34px;height:34px"><path d="M6 27 13 5h6l7 22z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="12" cy="20" r="2.6" fill="var(--accent)"/><circle cx="18.5" cy="14" r="2.3" fill="var(--accent)"/><circle cx="15" cy="9" r="1.8" fill="var(--accent)"/></svg>GRIMPE EPS</div>
    <h2>Code d'accès</h2><div class="codedots" id="lkDots"></div><div class="lockmsg" id="lkMsg">${esc(msg||"")}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="del" class="muted" aria-label="Effacer">Effacer</button><button data-k="0">0</button><button data-k="ok" class="muted" aria-label="Valider">Valider</button></div></div>`;
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>lockKey(b.dataset.k));drawDots();setSync("off");$("#lockBtn").hidden=true;}
function drawDots(){const n=Math.max(4,LK.length);$("#lkDots").innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<LK.length?"on":""}"></i>`).join("")}
function lockKey(k){
  if(k==="del")LK=LK.slice(0,-1);else if(k==="ok"){if(LK.length>=4)tryUnlock();return}else if(LK.length<8)LK+=k;
  drawDots();$("#lkMsg").textContent="";
  if(k!=="del"&&LK.length===(SY.codeLen||4)){const c=LK;setTimeout(()=>{if(LK===c)tryUnlock()},250)}
}
async function tryUnlock(){
  const code=LK;if(tryUnlock.busy)return;tryUnlock.busy=true;$("#lkMsg").textContent="Vérification…";$("#lkMsg").style.color="var(--muted)";
  let ok=false,cfg=null,offline=false;
  try{const j=await api("login",null,code);ok=!!j.ok;cfg={salt:j.salt,hash:j.hash}}
  catch(e){if(e.code!==401){offline=true;
    try{ok=SY.cfg&&SY.cfg.salt&&window.crypto&&crypto.subtle?(await sha(SY.cfg.salt+":"+code))===SY.cfg.hash:code==="2335"}catch(_){ok=code==="2335"}}}
  tryUnlock.busy=false;$("#lkMsg").style.color="";
  if(!ok){const d=$("#lkDots");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");
    $("#lkMsg").textContent=(SY.codeLen||4)===4?"Code incorrect. Code plus long ? Tapez-le puis Valider.":"Code incorrect";LK="";setTimeout(drawDots,400);return}
  SY.code=code;SY.codeLen=code.length;if(cfg)SY.cfg=cfg;SY.unlocked=true;persistSY();
  $("#lock").hidden=true;$("#lock").innerHTML="";$("#lockBtn").hidden=false;
  toast(offline?"Déverrouillé (hors ligne)":"Bienvenue !");syncNow();
}
function startSync(){
  if(!ONLINE)return;
  document.addEventListener("keydown",e=>{if($("#lock").hidden)return;if(/^\d$/.test(e.key))lockKey(e.key);else if(e.key==="Backspace")lockKey("del");else if(e.key==="Enter")lockKey("ok")});
  setInterval(()=>{if(document.visibilityState==="visible")syncNow()},6000);
  window.addEventListener("online",syncNow);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow()});
  if(!SY.unlocked||!SY.code){showLock();return}
  $("#lockBtn").hidden=false;syncNow();
}

/* ---------- démarrage ---------- */
render();
startSync();
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&window.top===window&&document.querySelector('link[rel="manifest"]')){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{})}}catch(e){}
</script>
